name: CI

# Every push and every pull request. The test suite runs against a real PostgreSQL 16,
# because that is the only way a passing test says anything about the shipped code path:
# there are no mocks in this repository and the schema is 18 SQL migrations rather than an
# ORM's opinion, so a test against a fake database would test the fake.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nothing here is a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: migrate, seed, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: cie
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test harness derives cie_test from this by swapping the database name, and
      # connects to /postgres to drop and recreate it, so the role needs CREATEDB. The
      # default postgres superuser has it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cie
      # The authored seed files are DACIS-derived and are not in this repository: Gate A
      # came back no on 14 August 2026. CI seeds from the synthetic set in tests/seed,
      # which reproduces every structural property the tests depend on with invented
      # companies. tests/seed/README.md lists those properties.
      CIE_SEED_DIR: ./tests/seed
      CIE_DROP_DIR: ./data/drops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: the lockfile is the contract. A dependency that drifted between
      # the lockfile and package.json should fail here rather than in someone's branch.
      - name: Install dependencies
        run: npm ci

      # A tracked file under data/seed, or a real-looking identifier anywhere in the tree,
      # means DACIS-derived data has been committed. Cheap to check on every push, and far
      # cheaper than discovering it after the fact.
      - name: No DACIS-derived data committed
        run: |
          if git ls-files data/seed | grep -qvE '(^|/)\.gitkeep$'; then
            echo "::error::A file under data/seed/ is tracked. Gate A forbids it."
            git ls-files data/seed
            exit 1
          fi
          # Synthetic identifiers use a ZZ prefix for UEIs and Z for CAGE codes, so a
          # 12-character alphanumeric token that is not one of those is worth a look.
          if git grep -nIE '\b[A-HJ-NP-Z0-9]{12}\b' -- 'src' 'tests' 'migrations' \
               | grep -vE 'ZZ[0-9]TESTUEI[0-9]{2}' \
               | grep -viE 'transactionnumber|modificationnumber|awardingagency|contractingagency|fundingagency|classification|documentation|configuration|implementation|instrumentation|participants|relationship|subcontracts|deobligation|SUPPORTPROFES' ; then
            echo "::warning::Tokens above look like identifiers. Confirm none is a real UEI."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      # Applying twice must be a no-op. The runner checksums each file and refuses a change
      # to one already applied, so this also catches an edited migration.
      - name: Migrations are idempotent
        run: |
          npm run migrate
          npm run migrate:status

      - name: Load seed files
        run: npm run seed

      - name: Seed loaders are idempotent
        run: npm run seed

      - name: Tests
        run: npm test

      # The scheduled jobs run against the seeded-but-not-loaded database CI has, which is also
      # the state of a fresh clone. Each one has to exit cleanly and say what it found rather
      # than failing on an empty corpus: a job that only works once data is loaded is a job
      # nobody discovers is broken until the day the data arrives.
      - name: The scheduled jobs run against an empty corpus
        run: |
          npm run profile -- --taxonomy-only
          npm run signals -- --dry-run
          npm run forecast -- --dry-run
          npm run forecast
          npm run forecast:backtest -- --as-of 2022-10-01
          # Twice, because the forecast is a derived table and a second run must change nothing.
          npm run forecast
          # Campaign sizing, the digest and the readiness report all have to survive an empty
          # corpus too. The digest in particular must print "nothing to send" rather than fail.
          npm run campaign
          npm run campaign -- --gap
          npm run size -- --actor ci@example.invalid
          npm run digest
          npm run readiness

      # The tests inject the fetch function, so the code that actually speaks HTTP — the bearer
      # header, the envelope, the pagination, the rate-limit headers, the clamp block — is the one
      # thing they never touch. The committed stubs are what cover it, and they only cover it if
      # something runs them.
      - name: Both loaders talk to their stubs over real HTTP
        run: |
          npm run profile -- --taxonomy-only

          # Redirected to files, not inherited. A backgrounded stub that keeps the step's stdout
          # open makes the step hang after its last command instead of finishing, and `npm run`
          # spawns a child that outlives a kill aimed at npm — so setsid gives each stub its own
          # process group to kill as a whole.
          setsid npx tsx scripts/sam-stub.ts    > sam-stub.log    2>&1 & echo $! > sam-stub.pid
          setsid npx tsx scripts/govcon-stub.ts > govcon-stub.log 2>&1 & echo $! > govcon-stub.pid

          for i in $(seq 1 30); do
            curl -sf "http://localhost:3999/opportunities/v2/search?api_key=stub&limit=1&postedFrom=01/01/2026&postedTo=01/02/2026" >/dev/null \
              && curl -sf -H 'Authorization: Bearer stub' http://localhost:3998/api/v1/status >/dev/null \
              && break
            sleep 1
          done
          # Two separate checks, because they catch different failures and one masks the other.
          #
          # A dead process is the one that bites: a stub that exits on EADDRINUSE leaves whatever
          # already holds the port answering in its place, and the curl below passes happily against
          # the wrong server. That is how a stale stub serves last week's fixtures to this week's
          # assertions, which is exactly the false pass this step exists to prevent.
          kill -0 "$(cat sam-stub.pid)"    2>/dev/null || { echo "::error::the SAM stub died"; cat sam-stub.log; exit 1; }
          kill -0 "$(cat govcon-stub.pid)" 2>/dev/null || { echo "::error::the GovCon stub died"; cat govcon-stub.log; exit 1; }

          # And stop rather than run seventeen requests against a stub that never came up.
          curl -sf "http://localhost:3999/opportunities/v2/search?api_key=stub&limit=1&postedFrom=01/01/2026&postedTo=01/02/2026" >/dev/null || { cat sam-stub.log; exit 1; }
          curl -sf -H 'Authorization: Bearer stub' http://localhost:3998/api/v1/status >/dev/null || { cat govcon-stub.log; exit 1; }

          export SAM_API_BASE=http://localhost:3999/opportunities/v2/search SAM_API_KEY=stub
          export GOVCON_API_BASE=http://localhost:3998/api/v1 GOVCON_API_KEY=stub

          # Each probe must exit zero against a reachable stub. A probe that cannot tell reachable
          # from unreachable is worse than no probe.
          npm run load:sam -- --probe
          npm run load:govcon -- --probe

          npm run load:govcon -- --dry-run --unfiltered --sample
          npm run load:govcon -- --unfiltered
          npm run load:govcon -- --cursor
          # Twice. The second run must ask for changes since the cursor, not for the window again.
          npm run load:govcon -- --unfiltered
          npm run load:govcon -- --backfill --from 2026-01-01

          # Contract actions. The stub serves three transactions on one PIID plus a rollup the loader
          # must refuse: writing that rollup would put a whole contract's obligation on a single row
          # and every downstream total would be wrong without anything failing.
          npm run load:contracts -- --dry-run --from 2024-11-01 --sample
          npm run load:contracts -- --from 2024-11-01
          npm run load:contracts -- --cursor
          # Again, to prove the hash skip: the second run must write nothing.
          npm run load:contracts -- --from 2024-11-01
          # And the ungated company path, which must not move the search cursor.
          npm run load:contracts -- --uei ZGCONUEI0001

          # The same notice through the direct SAM.gov loader must not produce a second pursuit.
          npm run load:sam

          npm run screen -- --find Example
          npm run screen -- ZGCONUEI0002

          kill -- "-$(cat sam-stub.pid)" "-$(cat govcon-stub.pid)" || true

      # Two loaders write notices and key on the same signal_key on purpose (decision D25). A
      # duplicate here means somebody added a second write path, and the symptom in production is a
      # person seeing the same requirement twice in their feed with nothing having errored.
      #
      # This has to run after the step above, because it asserts against what those loaders actually
      # wrote — including that the two stubs' shared notice id produced one row and two source
      # versions.
      - name: One notice is one requirement, whichever API delivered it
        run: npm run check:convergence

      # Acceptance tests are expected to report blocked items until the remaining phases
      # exist. A FAIL is what must not happen, so that is what is checked.
      - name: Acceptance tests report no failures
        run: |
          npm run accept | tee acceptance.log
          if grep -qE '^FAIL' acceptance.log; then
            echo "::error::An acceptance test failed. Blocked is expected; failed is not."
            exit 1
          fi
          grep -E '^[0-9]+ pass' acceptance.log || true

      # The interface is server-rendered with no build step, so nothing but running it
      # proves it still runs. Every screen is checked against the seeded-but-not-loaded
      # database CI has, which is also the state a fresh clone is in: each one must
      # render and explain its own emptiness rather than 500.
      - name: The interface serves every screen
        run: |
          npm run web & echo $! > web.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          status=0
          for route in / /feed '/feed?view=everything' '/feed?view=tracked' \
                       '/feed?view=patch&sort=fit' /follows /forecast \
                       '/forecast?scope=everything&confidence=high' /handoffs \
                       /overview /entities /contracts /subcontracts /customers \
                       /programs /dacis-contracts /taxonomy /watchlist /review /quality \
                       /campaigns /acceptance /healthz /api/dashboard /api/feed \
                       /api/forecast /api/handoffs /api/campaigns /api/overview \
                       /api/acceptance /api/quality \
                       /app.css /fonts/Archivo-Regular.woff2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$route")
            if [ "$code" != "200" ]; then
              echo "::error::$route returned $code"
              status=1
            else
              echo "  $code  $route"
            fi
          done
          # The old pipeline URLs still resolve rather than 404ing somebody's bookmark.
          for old in /pipeline /my-work /upcoming /pursuits/1; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$old")
            case "$code" in
              301|302) echo "  $code  $old (moved)" ;;
              *) echo "::error::$old returned $code, expected a redirect."; status=1 ;;
            esac
          done
          # Writing is answered on three shapes of path and nowhere else, so the audit trail
          # cannot be bypassed by finding another endpoint.
          for notanaction in / /requirements/1/nonsense /follows/nonsense /feed; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000$notanaction")
            if [ "$code" != "404" ]; then
              echo "::error::POST $notanaction returned $code, expected 404. POST is only an action path."
              status=1
            fi
          done
          # And with no authentication configured, a real action is refused rather than
          # attributed to nobody. CIE_AUTH_MODE is unset in this job, so this is the secure
          # default being checked rather than a special case. Spec section 20.
          for action in /requirements/1/track /requirements/1/sent /follows/follow /feed/mark-read; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000$action")
            if [ "$code" != "403" ]; then
              echo "::error::POST $action returned $code, expected 403. No actor, no write."
              status=1
            fi
          done
          # The spreadsheet export is a GET because it writes nothing, and it refuses an
          # empty selection rather than assembling the whole corpus.
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/export.csv')
          if [ "$code" != "400" ]; then
            echo "::error::/export.csv with no selection returned $code, expected 400."
            status=1
          fi
          kill "$(cat web.pid)" 2>/dev/null || true
          exit $status

      - name: Upload acceptance output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-log
          path: acceptance.log
          retention-days: 14

  # A second job so a Docker problem is distinguishable from a test failure. The
  # Dockerfile is how this deploys to Azure Container Apps, per spec section 2.3, and an
  # image that stopped building would otherwise only be discovered at deploy time.
  image:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t cie:ci .
